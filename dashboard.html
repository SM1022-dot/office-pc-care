<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>PC Care Dashboard</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1c2230; --muted:#5d6678; --line:#e2e5eb; --brand:#1f6feb; --ok:#1a7f37; --warn:#9a6700; --bad:#cf222e; --chip:#eef1f5; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e1116; --card:#161b22; --text:#e6e9ef; --muted:#97a0b0; --line:#2a313c; --brand:#4c8dff; --ok:#3fb950; --warn:#d29922; --bad:#f85149; --chip:#21262d; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding:24px 16px; }
  main { max-width:1200px; margin:0 auto; }
  h1 { font-size:22px; margin:0; } h2 { font-size:16px; margin:0 0 10px; } h3 { font-size:14px; margin:14px 0 6px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .top { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .muted { color:var(--muted); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:16px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .stat b { display:block; font-size:24px; }
  .tablewrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-weight:600; font-size:12px; }
  tr.row { cursor:pointer; } tr.row:hover td { background:var(--chip); }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); }
  .chip { display:inline-block; background:var(--chip); border-radius:999px; padding:1px 8px; margin:2px 4px 2px 0; font-size:12px; }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:16px; }
  .kv td:first-child { color:var(--muted); width:42%; }
  .kv td { white-space:normal; }
  button, input { font:inherit; }
  button { background:var(--brand); color:#fff; border:0; border-radius:8px; padding:8px 14px; cursor:pointer; }
  button.ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
  button.danger { background:var(--bad); }
  input[type=password] { padding:9px 12px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--text); width:260px; max-width:100%; }
  .login { max-width:420px; margin:80px auto; }
  ul.plain { margin:0; padding-left:18px; } ul.plain li { margin:2px 0; }
  .added { color:var(--ok); } .removed { color:var(--bad); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <section id="login" class="card login">
    <h1>PC Care Dashboard</h1>
    <p class="muted">IT only. Enter the dashboard password.</p>
    <form id="loginForm">
      <input type="password" id="pw" autocomplete="current-password" placeholder="Password" required>
      <button type="submit">Open</button>
    </form>
    <p id="loginMsg" class="bad"></p>
  </section>

  <section id="app" hidden>
    <div class="top">
      <div><h1>PC Care Dashboard</h1><div class="muted" id="updated"></div></div>
      <div><button class="ghost" id="refresh">Refresh</button> <button class="ghost" id="logout">Lock</button></div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="card">
      <div class="top"><h2>Office PCs</h2><input type="search" id="search" placeholder="Search name, desk, team, PC, user or IP" style="padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);width:320px;max-width:100%"></div>
      <p class="muted" style="margin-top:0">Click a PC to see details and to set the person's name, desk and team.</p>
      <div class="tablewrap"><table id="pcTable"></table></div>
      <p class="muted" id="empty" hidden>No PC has sent a report yet. PCs send one report per day after setup (or from menu 9).</p>
    </div>
    <div class="card" id="detail" hidden></div>
    <div class="card">
      <h2>Toolkit releases</h2>
      <div class="tablewrap"><table id="releases"></table></div>
    </div>
  </section>
</main>
<script>
(function () {
  var state = { data: null, latestBuild: 0, releases: [] };
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function pw() { try { return sessionStorage.getItem('pccare-pw') || ''; } catch (e) { return ''; } }
  function setPw(v) { try { if (v) sessionStorage.setItem('pccare-pw', v); else sessionStorage.removeItem('pccare-pw'); } catch (e) {} }
  function bdTime(iso) {
    if (!iso) return '';
    var d = new Date(iso); if (isNaN(d)) return esc(iso);
    return d.toLocaleString('en-GB', { timeZone: 'Asia/Dhaka', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) + ' BD';
  }
  function ago(iso) {
    var d = new Date(iso); if (isNaN(d)) return '';
    var h = (Date.now() - d.getTime()) / 36e5;
    if (h < 1) return Math.max(1, Math.round(h * 60)) + ' min ago';
    if (h < 48) return Math.round(h) + ' h ago';
    return Math.round(h / 24) + ' days ago';
  }
  function num(v, d) { return v == null || isNaN(v) ? '-' : Number(v).toFixed(d == null ? 1 : d); }
  function cDrive(r) { var c = ((r.hardware || {}).drives || []).filter(function (x) { return x.id === 'C:'; })[0]; return c || null; }
  function bsCounts(cr) {
    cr = cr || {};
    var real = cr.realBlueScreens30d, power = cr.powerLoss30d;
    if (real == null) { real = (cr.lastBlueScreens || []).filter(function (x) { return Number(x.id) === 1001; }).length; power = Math.max(0, (cr.blueScreens30d || 0) - real); }
    return { real: real || 0, power: power || 0 };
  }
  function diskBad(r) { return ((r.hardware || {}).disks || []).some(function (d) { return d.health && d.health !== 'Healthy' && d.health !== 'OK'; }); }
  function cls(ok, warn) { return ok ? 'ok' : (warn ? 'warn' : 'bad'); }

  function api(method, path, body) {
    var headers = { Authorization: 'Bearer ' + pw() };
    if (body) headers['Content-Type'] = 'application/json';
    return fetch(path, { method: method, headers: headers, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' })
      .then(function (r) {
        if (r.status === 401) throw new Error('wrong password');
        if (r.status === 503) throw new Error('Password is correct, but the dashboard storage (Upstash Redis) is not connected yet.');
        if (!r.ok) throw new Error('server error ' + r.status);
        return r.json();
      });
  }

  function load() {
    $('updated').textContent = 'Loading...';
    Promise.all([
      api('GET', '/api/data'),
      fetch('/toolkit/manifest.json', { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; }),
      fetch('/toolkit/releases.json', { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : []; }).catch(function () { return []; })
    ]).then(function (res) {
      state.data = res[0]; state.latestBuild = Number(res[1].build || 0); state.releases = res[2] || [];
      $('login').hidden = true; $('app').hidden = false;
      render();
    }).catch(function (e) {
      if (String(e.message).indexOf('wrong password') >= 0) { setPw(''); $('app').hidden = true; $('login').hidden = false; $('loginMsg').textContent = 'Wrong password.'; }
      else if ($('app').hidden) { $('loginMsg').textContent = e.message; }
      else { $('updated').textContent = 'Could not load: ' + e.message; }
    });
  }

  function render() {
    var pcs = (state.data.pcs || []).filter(function (p) { return p.latest; });
    var today = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Dhaka' });
    var seenToday = pcs.filter(function (p) { return p.latest.reportDate === today; }).length;
    var onLatest = pcs.filter(function (p) { return Number(p.latest.build) >= state.latestBuild; }).length;
    var bsod = pcs.filter(function (p) { return bsCounts(p.latest.crashes).real > 0; }).length;
    var badDisk = pcs.filter(function (p) { return diskBad(p.latest); }).length;
    var lowDisk = pcs.filter(function (p) { var c = cDrive(p.latest); return c && c.freeGB < 15; }).length;
    $('updated').textContent = 'Updated ' + bdTime(state.data.generated) + '  -  latest toolkit build ' + state.latestBuild;
    $('stats').innerHTML = [
      ['PCs with toolkit', pcs.length, ''],
      ['Reported today', seenToday, seenToday === pcs.length ? 'ok' : 'warn'],
      ['On latest build', onLatest + ' / ' + pcs.length, onLatest === pcs.length ? 'ok' : 'warn'],
      ['Real blue screens (30 days)', bsod + ' PC', bsod ? 'bad' : 'ok'],
      ['C: under 15 GB free', lowDisk + ' PC', lowDisk ? 'warn' : 'ok'],
      ['Disk health warning', badDisk + ' PC', badDisk ? 'bad' : 'ok']
    ].map(function (s) { return '<div class="stat"><span class="muted">' + esc(s[0]) + '</span><b class="' + s[2] + '">' + esc(s[1]) + '</b></div>'; }).join('');

    $('empty').hidden = pcs.length > 0;
    var q = ($('search').value || '').toLowerCase().trim();
    var shown = pcs.filter(function (p) {
      if (!q) return true;
      var r = p.latest, l = p.label || {};
      return [p.pc, l.label, l.team, l.note, r.user, r.userFullName, (r.ipv4 || []).join(' '), r.timeZone].join(' ').toLowerCase().indexOf(q) >= 0;
    });
    shown.sort(function (a, b) { return String((a.label || {}).label || '~' + a.pc).localeCompare(String((b.label || {}).label || '~' + b.pc)); });
    var head = '<tr><th>Person / desk</th><th>Team</th><th>PC</th><th>Windows user</th><th>Build</th><th>Last report</th><th>Running for</th><th>CPU / disk busy</th><th>RAM free</th><th>C: free</th><th>Outlook mail</th><th>Viber</th><th>Blue screen / power-off 30d</th><th>App crashes 7d</th></tr>';
    $('pcTable').innerHTML = head + shown.map(function (p) {
      var r = p.latest, m = r.memory || {}, c = cDrive(r), cr = r.crashes || {}, l = p.label || {};
      var appCr = (cr.appCrashes7d || []).reduce(function (a, x) { return a + (x.count || 0); }, 0);
      var buildCls = Number(r.build) >= state.latestBuild ? 'ok' : 'warn';
      var tz = /GMT Standard|UTC$|Greenwich/i.test(r.timeZone || '') ? 'UK time' : (/Bangladesh/i.test(r.timeZone || '') ? 'BD time' : (r.timeZone || ''));
      return '<tr class="row" data-pc="' + esc(p.pc) + '">' +
        '<td>' + (l.label ? '<b>' + esc(l.label) + '</b>' : '<span class="warn">Set name</span>') + '</td>' +
        '<td>' + esc(l.team || '') + '<div class="muted">' + esc(tz) + '</div></td>' +
        '<td>' + esc(p.pc) + (diskBad(r) ? ' <span class="bad">disk warning</span>' : '') + '<div class="muted">' + esc((r.ipv4 || []).join(', ')) + '</div></td>' +
        '<td>' + esc((r.user || '').split('\\').pop()) + '<div class="muted">' + esc(r.userFullName || '') + '</div></td>' +
        '<td class="' + buildCls + '">' + esc(r.build) + '</td><td>' + esc(ago(r.time)) + '<div class="muted">' + bdTime(r.time) + '</div></td>' +
        '<td>' + num((r.windows || {}).uptimeHours, 0) + ' h</td>' +
        (function (ld) {
          if (!ld || ld.cpuPercent == null) return '<td class="muted">-</td>';
          var busy = Math.max.apply(null, (ld.disks || []).map(function (d) { return d.busyPercent || 0; }).concat([0]));
          return '<td><span class="' + cls(ld.cpuPercent < 60, ld.cpuPercent < 85) + '">' + num(ld.cpuPercent, 0) + '% CPU</span><div class="' + cls(busy < 50, busy < 80) + '">' + num(busy, 0) + '% disk</div></td>';
        })(r.load) +
        '<td class="' + cls(m.freeGB >= 2, m.freeGB >= 1) + '">' + num(m.freeGB) + ' / ' + num(m.totalGB, 0) + ' GB</td>' +
        '<td class="' + (c ? cls(c.freeGB >= 25, c.freeGB >= 15) : '') + '">' + (c ? num(c.freeGB, 0) + ' GB' : '-') + '</td>' +
        '<td>' + num(((r.outlook || {}).totalMB || 0) / 1024) + ' GB</td>' +
        (function (vb) {
          if (!vb || !vb.installed) return '<td class="muted">-</td>';
          var data = (vb.dataMB || 0) / 1024;
          return '<td class="' + cls(data < 1, data < 3) + '">' + num(data) + ' GB data<div class="muted">' + (vb.running ? esc(vb.ramMB) + ' MB RAM' : 'not running') + '</div>' +
            (r.viberHangs && (r.viberHangs.enabled || r.viberHangs.total) ? '<div class="' + (r.viberHangs.last24h ? 'bad' : 'ok') + '">' + esc(r.viberHangs.last24h || 0) + ' freezes 24h</div>' : '') + '</td>';
        })(r.viber) +
        (function (b) { return '<td><span class="' + (b.real ? 'bad' : 'ok') + '">' + b.real + ' blue screen</span><div class="' + (b.power ? 'warn' : 'muted') + '">' + b.power + ' power-off</div></td>'; })(bsCounts(cr)) +
        '<td class="' + (appCr ? 'warn' : 'ok') + '">' + appCr + '</td></tr>';
    }).join('');
    Array.prototype.forEach.call(document.querySelectorAll('tr.row'), function (tr) { tr.onclick = function () { showDetail(tr.getAttribute('data-pc')); }; });

    $('releases').innerHTML = '<tr><th>Build</th><th>Published</th><th>What changed</th></tr>' +
      state.releases.slice().reverse().map(function (x) { return '<tr><td>' + esc(x.build) + '</td><td>' + bdTime(x.published) + '</td><td style="white-space:normal">' + esc(x.notes) + '</td></tr>'; }).join('');
  }

  // Generic view of any report value: objects as key/value tables, lists of objects as tables.
  function renderValue(v) {
    if (v == null || v === '') return '<span class="muted">-</span>';
    if (Array.isArray(v)) {
      if (!v.length) return '<span class="muted">None</span>';
      if (typeof v[0] === 'object' && v[0] !== null && !Array.isArray(v[0])) {
        var cols = []; v.forEach(function (o) { Object.keys(o).forEach(function (k) { if (cols.indexOf(k) < 0) cols.push(k); }); });
        return '<div class="tablewrap"><table><tr>' + cols.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr>' +
          v.map(function (o) { return '<tr>' + cols.map(function (c) { var x = o[c]; return '<td style="white-space:normal">' + (x != null && typeof x === 'object' ? esc(JSON.stringify(x)) : esc(x)) + '</td>'; }).join('') + '</tr>'; }).join('') + '</table></div>';
      }
      return v.map(function (x) { return '<span class="chip">' + esc(x) + '</span>'; }).join('');
    }
    if (typeof v === 'object') {
      return '<table class="kv">' + Object.keys(v).map(function (k) { return '<tr><td>' + esc(k) + '</td><td>' + renderValue(v[k]) + '</td></tr>'; }).join('') + '</table>';
    }
    return esc(v);
  }
  function kv(rows) { return '<table class="kv">' + rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td>' + r[1] + '</td></tr>'; }).join('') + '</table>'; }
  function list(items) { return items && items.length ? '<ul class="plain">' + items.map(function (i) { return '<li>' + i + '</li>'; }).join('') + '</ul>' : '<span class="muted">None</span>'; }
  function swDiff(oldR, newR) {
    if (!oldR || !newR) return null;
    var key = function (s) { return s.name + ' ' + (s.version || ''); };
    var o = {}, n = {};
    (oldR.software || []).forEach(function (s) { o[key(s)] = s; });
    (newR.software || []).forEach(function (s) { n[key(s)] = s; });
    var added = Object.keys(n).filter(function (k) { return !o[k]; }).sort();
    var removed = Object.keys(o).filter(function (k) { return !n[k]; }).sort();
    return { added: added, removed: removed };
  }
  function diffBlock(title, d) {
    if (!d) return '<h3>' + esc(title) + '</h3><span class="muted">Not enough reports yet.</span>';
    if (!d.added.length && !d.removed.length) return '<h3>' + esc(title) + '</h3><span class="muted">No software changes.</span>';
    return '<h3>' + esc(title) + '</h3>' + list(d.added.map(function (x) { return '<span class="added">+ ' + esc(x) + '</span>'; }).concat(d.removed.map(function (x) { return '<span class="removed">- ' + esc(x) + '</span>'; })));
  }
  function compareRow(label, a, b) { return [label, esc(a) + (a !== b && b != null && b !== '' ? ' <span class="muted">(was ' + esc(b) + ')</span>' : '')]; }

  function showDetail(name) {
    var p = (state.data.pcs || []).filter(function (x) { return x.pc === name; })[0]; if (!p || !p.latest) return;
    var r = p.latest, f = p.first, pv = p.previous, hw = r.hardware || {}, w = r.windows || {}, m = r.memory || {}, s = r.settings || {}, cr = r.crashes || {}, ol = r.outlook || {};
    var l = p.label || {};
    var html = '<div class="top"><h2>' + esc(l.label || p.pc) + ' <span class="muted">' + esc(p.pc) + ' - ' + esc(r.user || '') + '</span></h2><div><button class="ghost" id="closeDetail">Close</button> <button class="danger" id="deletePc">Remove from dashboard</button></div></div>';
    html += '<form id="labelForm" class="card" style="margin-bottom:12px"><h3 style="margin-top:0">Whose PC is this?</h3>' +
      '<input id="lbName" placeholder="Person name and desk, e.g. Rakib - Desk 12" value="' + esc(l.label || '') + '" style="padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);width:320px;max-width:100%"> ' +
      '<select id="lbTeam" style="padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text)">' +
      ['', 'BD', 'UK', 'Other'].map(function (t) { return '<option value="' + t + '"' + ((l.team || '') === t ? ' selected' : '') + '>' + (t || 'Team') + '</option>'; }).join('') + '</select> ' +
      '<input id="lbNote" placeholder="Note (optional)" value="' + esc(l.note || '') + '" style="padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);width:260px;max-width:100%"> ' +
      '<button type="submit">Save</button> <span id="lbMsg" class="muted"></span>' +
      '<div class="muted" style="margin-top:6px">Windows account name: ' + esc(r.userFullName || '-') + '  |  IP: ' + esc((r.ipv4 || []).join(', ') || '-') + '  |  PC time zone: ' + esc(r.timeZone || '-') + '</div></form>';
    html += '<div class="grid2"><div>' +
      '<h3>Hardware</h3>' + kv([
        ['CPU', esc(hw.cpu) + ' <span class="muted">(' + esc(hw.cores) + ' cores / ' + esc(hw.threads) + ' threads)</span>'],
        ['Motherboard', esc(hw.board)], ['PC model', esc(hw.model)],
        ['RAM', num(hw.ramGB) + ' GB in ' + esc((hw.ramSticks || []).length) + ' of ' + esc(hw.ramSlots) + ' slots'],
        ['RAM sticks', list((hw.ramSticks || []).map(function (x) { return esc(x.slot) + ': ' + esc(x.gb) + ' GB ' + esc(x.mhz) + ' MHz ' + esc(x.part); }))],
        ['Disks', list((hw.disks || []).map(function (x) {
          var extra = [];
          if (x.temperatureC != null) extra.push(esc(x.temperatureC) + ' C');
          if (x.powerOnHours != null) extra.push(esc(x.powerOnHours) + ' h on');
          if (x.readErrorsUncorrected != null) extra.push('<span class="' + (x.readErrorsUncorrected ? 'bad' : 'muted') + '">' + esc(x.readErrorsUncorrected) + ' read errors not fixed</span>');
          return esc(x.name) + ' | ' + esc(x.type) + ' | ' + esc(x.gb) + ' GB | <span class="' + (x.health === 'Healthy' || x.health === 'OK' ? 'ok' : 'bad') + '">' + esc(x.health) + (x.status ? ' (' + esc(x.status) + ')' : '') + '</span>' + (extra.length ? '<div class="muted">' + extra.join(' | ') + '</div>' : '');
        }))],
        ['VM files', list((r.vmFiles || []).map(function (v) { return esc(v.vm) + ' on ' + esc(v.drive) + ' <span class="' + (/HDD/i.test(v.diskType || '') ? 'warn' : 'muted') + '">' + esc(v.diskType || '') + '</span> - ' + esc(v.sizeGB) + ' GB'; }))],
        ['Drives', list((hw.drives || []).map(function (x) { return esc(x.id) + ' ' + num(x.freeGB, 0) + ' GB free of ' + num(x.sizeGB, 0); }))],
        ['Graphics', esc(hw.gpu)]
      ]) +
      '<h3>Windows</h3>' + kv([
        ['Windows', esc(w.name) + ' ' + esc(w.version) + ' (build ' + esc(w.build) + ')'],
        ['Activation', esc(w.activation || '-')],
        ['BIOS', esc((r.bios || {}).version || '-') + ' ' + esc((r.bios || {}).date || '') + ' <span class="muted">serial ' + esc((r.bios || {}).serial || '-') + '</span>'],
        ['Last start', bdTime(w.lastBoot) + ' (' + num(w.uptimeHours, 0) + ' h)'],
        compareRow('Toolkit build', r.build, pv ? pv.build : null),
        ['Setup done', s.setupDone ? '<span class="ok">Yes</span>' : '<span class="bad">No</span>'],
        ['Windows Update', esc(s.wuStart)], ['Edge blocked', s.edgeOff ? 'Yes' : 'No'],
        ['Tasks', 'Auto Care ' + (s.autoCareTask ? '<span class="ok">on</span>' : '<span class="bad">missing</span>') + ', Viber first ' + (s.viberTask ? '<span class="ok">on</span>' : '<span class="bad">missing</span>') + ', Slow start ' + (s.slowStartTask ? '<span class="ok">on</span>' : '<span class="bad">missing</span>') + ', Update check (15 min) ' + (s.updateTask ? '<span class="ok">on</span>' : '<span class="warn">not yet</span>')]
      ]) +
      '<h3>VPN and VM</h3>' + kv([
        ['VPN adapters', list((r.vpn || []).map(function (x) { return esc(x.name) + ' - <span class="' + (x.status === 'Up' ? 'ok' : 'muted') + '">' + esc(x.status) + '</span>'; }))],
        ['VM', r.vm && r.vm.running ? 'Running, ' + num(r.vm.memMB, 0) + ' MB' : 'Not running']
      ]) +
      '</div><div>' +
      '<h3>Memory at report time</h3>' + kv([
        ['RAM free', num(m.freeGB) + ' of ' + num(m.totalGB) + ' GB'],
        ['Commit', num(m.commitUsedGB) + ' of ' + num(m.commitTotalGB) + ' GB'],
        ['Page file', esc(m.pagefileMB) + ' MB']
      ]) +
      (function (ld) {
        if (!ld || ld.cpuPercent == null) return '';
        return '<h3>CPU and disk (5-second sample at report time)</h3>' + kv([
          ['CPU in use', num(ld.cpuPercent, 0) + '%'],
          ['Top CPU apps', list((ld.topCpu || []).map(function (x) { return esc(x.name) + ' - ' + num(x.percent, 1) + '%'; }))],
          ['Disks', list((ld.disks || []).map(function (d) { return esc(d.disk) + ' - ' + num(d.busyPercent, 0) + '% busy, queue ' + esc(d.queue); }))]
        ]);
      })(r.load) +
      '<h3>Top memory apps</h3>' + list((r.topApps || []).map(function (x) { return esc(x.name) + (x.count > 1 ? ' x' + esc(x.count) : '') + ' - ' + esc(x.mb) + ' MB'; })) +
      (function (vb) {
        if (!vb) return '';
        return '<h3>Viber</h3>' + kv([
          ['Version', esc(vb.version || '-') + (vb.running ? ' <span class="ok">running</span> ' + esc(vb.ramMB) + ' MB RAM, open ' + esc(vb.runningHours) + ' h' : ' <span class="muted">not running</span>')],
          ['Viber data (AppData)', num((vb.dataMB || 0) / 1024, 2) + ' GB in ' + esc(vb.dataFiles || 0) + ' files'],
          ['Database files', num((vb.databaseMB || 0) / 1024, 2) + ' GB'],
          ['ViberDownloads (Documents)', num((vb.downloadsMB || 0) / 1024, 2) + ' GB in ' + esc(vb.downloadsFiles || 0) + ' files'],
          ['Toolkit cache backups', esc(vb.toolkitCacheBackupMB || 0) + ' MB'],
          ['Biggest folders', list((vb.folders || []).map(function (f) { return esc(f.folder) + ' - ' + esc(f.mb) + ' MB, ' + esc(f.files) + ' files'; }))],
          ['Biggest files', list((vb.largestFiles || []).map(function (f) { return esc(f.file) + ' - ' + esc(f.mb) + ' MB <span class="muted">' + esc(f.modified) + '</span>'; }))]
        ]);
      })(r.viber) +
      (function (vh) {
        if (!vh || !(vh.enabled || vh.total)) return '';
        var st = vh.status || {};
        return '<h3>Viber freezes (watcher)</h3>' + kv([
          ['Watching', (vh.enabled ? '<span class="ok">on</span>' : '<span class="muted">off</span>') + ' until ' + esc(vh.until) + (st.lastAlive ? ' <span class="muted">alive ' + bdTime(st.lastAlive) + ', ' + esc(st.checks) + ' checks, watcher ' + esc(st.watcherMB) + ' MB RAM</span>' : '')],
          ['Last 24 h', esc(vh.last24h || 0) + ' freezes, ' + esc(vh.notResponding24h || 0) + ' Not Responding, longest ' + num(vh.longestSec24h || 0) + ' s'],
          ['Recent', list((vh.recent || []).slice().reverse().map(function (h) {
            return esc(h.bdTime) + ' - frozen at least <b>' + num(h.seconds) + ' s</b>' + (h.notResponding ? ' <span class="bad">Not Responding</span>' : '') +
              ' | RAM free ' + esc(h.ramFreeMB) + ' MB, commit ' + esc(h.commitUsedMB) + '/' + esc(h.commitLimitMB) + ' MB | CPU ' + esc(h.cpuPercent) + '%: ' +
              (h.topCpu || []).slice(0, 3).map(function (x) { return esc(x.name) + ' ' + esc(x.percent) + '%'; }).join(', ') +
              ' | disk ' + (h.disks || []).map(function (d) { return esc(d.busyPercent) + '% q' + esc(d.queue); }).join(' / ') +
              ' | Viber read ' + esc(h.viberReadMBs) + ' / write ' + esc(h.viberWriteMBs) + ' MB/s, ' + esc(h.viberMB) + ' MB';
          }))]
        ]);
      })(r.viberHangs) +
      '<h3>Outlook</h3>' + kv([['Version', esc(ol.version)], ['Offline months per account', list((ol.accounts || []).map(function (x) { return esc(x.account) + ' - <span class="' + (x.offlineMonths === 'All' ? 'ok' : 'warn') + '">' + esc(x.offlineMonths) + (x.offlineMonths === 'All' ? '' : ' months') + '</span>'; }))], ['Mail files', list((ol.mailFiles || []).map(function (x) { return esc(x.name) + ' - ' + esc(x.mb) + ' MB'; }))]]) +
      '<h3>Blue screens and sudden restarts (30 days)</h3>' + list((cr.lastBlueScreens || []).map(function (x) { return bdTime(x.time) + ' - Event ' + esc(x.id) + ' ' + esc(x.msg); })) +
      '<h3>App crashes (7 days)</h3>' + list((cr.appCrashes7d || []).map(function (x) { return esc(x.app) + ' - ' + esc(x.count) + 'x'; })) +
      '<h3>Startup</h3>' + kv([
        ['Opens at sign-in', list((r.startupNow || []).map(esc))],
        ['Opens slowly after 3 min', list((r.slowStart || []).map(esc))]
      ]) +
      '</div></div>' +
      diffBlock('Software changes since the toolkit was installed', f && f !== r ? swDiff(f, r) : null) +
      diffBlock('Software changes since the previous day', swDiff(pv, r)) +
      '<h3>Installed software (' + esc((r.software || []).length) + ')</h3>' + list((r.software || []).map(function (x) { return esc(x.name) + ' <span class="muted">' + esc(x.version) + '</span>'; })) +
      '<h3>Chrome extensions</h3>' + ((r.chromeExtensions || []).length ? (r.chromeExtensions || []).map(function (x) { return '<span class="chip">' + esc(x) + '</span>'; }).join('') : '<span class="muted">None</span>') +
      '<h3>Network</h3>' + list((r.network || []).map(function (n) { return '<b>' + esc(n.name) + '</b> - <span class="' + (n.status === 'Up' ? 'ok' : 'muted') + '">' + esc(n.status) + '</span> ' + esc(n.speed || '') + ' <span class="muted">' + esc(n.description) + '</span><br>IP ' + esc((n.ipv4 || []).join(', ') || '-') + '  |  DNS ' + esc((n.dns || []).join(', ') || '-') + '  |  MAC ' + esc(n.mac || '-'); })) +
      '<div style="margin-top:16px"><button class="ghost" id="fullBtn">Show full report (everything this PC sent)</button></div><div id="fullReport" hidden></div>';
    var box = $('detail'); box.innerHTML = html; box.hidden = false; box.scrollIntoView({ behavior: 'smooth' });
    $('closeDetail').onclick = function () { box.hidden = true; };
    $('fullBtn').onclick = function () {
      var fr = $('fullReport');
      if (fr.hidden) { fr.innerHTML = '<h3>Full report - ' + bdTime(r.time) + '</h3>' + renderValue(r); fr.hidden = false; $('fullBtn').textContent = 'Hide full report'; }
      else { fr.hidden = true; $('fullBtn').textContent = 'Show full report (everything this PC sent)'; }
    };
    $('labelForm').onsubmit = function (e) {
      e.preventDefault();
      $('lbMsg').textContent = 'Saving...';
      api('POST', '/api/data?pc=' + encodeURIComponent(p.pc), { label: $('lbName').value, team: $('lbTeam').value, note: $('lbNote').value })
        .then(function (res) { p.label = res.label; $('lbMsg').textContent = 'Saved.'; render(); })
        .catch(function (err) { $('lbMsg').textContent = 'Failed: ' + err.message; });
    };
    var del = $('deletePc');
    del.onclick = function () {
      if (del.getAttribute('data-sure') !== '1') { del.setAttribute('data-sure', '1'); del.textContent = 'Click again to remove ' + p.pc; return; }
      api('DELETE', '/api/data?pc=' + encodeURIComponent(p.pc)).then(function () { box.hidden = true; load(); }).catch(function (e) { del.textContent = 'Failed: ' + e.message; });
    };
  }

  $('loginForm').onsubmit = function (e) { e.preventDefault(); setPw($('pw').value); $('pw').value = ''; $('loginMsg').textContent = ''; load(); };
  $('refresh').onclick = load;
  $('search').oninput = function () { if (state.data) render(); };
  $('logout').onclick = function () { setPw(''); location.reload(); };
  if (pw()) load();
})();
</script>
</body>
</html>
